<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Expense Tracker</h2>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
  </div>

  <!-- Add Expense -->
  <div class="card p-4 mb-4 shadow-sm">
    <h4>Add / Edit Expense</h4>
    <input type="hidden" id="expenseId">

    <div class="row mt-3">
      <div class="col">
        <input id="title" class="form-control" placeholder="Title">
      </div>
      <div class="col">
        <input id="amount" type="number" class="form-control" placeholder="Amount">
      </div>
      <div class="col">
        <select id="category" class="form-select">
          <option value="">Select Category</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Other</option>
        </select>
      </div>
      <div class="col">
        <button class="btn btn-primary w-100" onclick="saveExpense()">Save</button>
      </div>
    </div>
  </div>

  <!-- Filter -->
  <div class="mb-3">
    <select id="filterCategory" class="form-select w-25" onchange="loadExpenses()">
      <option value="">All Categories</option>
      <option>Food</option>
      <option>Travel</option>
      <option>Shopping</option>
      <option>Bills</option>
      <option>Other</option>
    </select>
  </div>

  <!-- Total -->
  <div class="alert alert-success">
    <strong>Total Expense: ₹ <span id="totalAmount">0</span></strong>
  </div>

  <!-- Expense List -->
  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expenseList"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
