<!DOCTYPE html>
<html>
<head>
  <title>Login - Expense Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">
    
    <h3 class="text-center mb-4">Expense Tracker</h3>
    <h5 class="text-center text-muted mb-4">Login to your account</h5>

    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input id="email" type="email" class="form-control" placeholder="Enter email">
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-control" placeholder="Enter password">
    </div>

    <button class="btn btn-primary w-100 mb-3" onclick="login()">Login</button>

    <div class="text-center">
      <small>
        Don’t have an account?
        <a href="register.html" class="text-decoration-none">Register here</a>
      </small>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
